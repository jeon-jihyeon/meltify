# Project settings for meltify, found by searching from the working directory up to the git root
# Outside a git repository, only the working directory is searched
# Every key is optional and falls back to the packaged defaults

# Language of the text OCR reads
lang = "ko"
out_dir = "meltify-out"

[llm]
claude_model = "claude-opus-5-5"
gemini_model = "gemini-3-pro"
openai_model = "gpt-5.5"

[ocr]
# auto uses installed local engines and every endpoint below. List paid ones here to add them
engines = "auto"
# Resize factor before OCR, 0 to size each picture on its own
upscale = 0
dpi = 300

[asr]
engine = "auto"
# Path to a ggml model file. whisper.cpp stays unavailable until it's set
# whispercpp_model = "~/models/ggml-large-v3-turbo.bin"
# Spoken language, separate from lang above. auto lets Whisper detect it per recording
lang = "auto"

# A model you serve yourself is an engine named after its table that auto runs, with no key.
# key_env, timeout and, for OCR, prompt are optional
# [ocr.endpoints.paddle-vl]
# base_url = "http://127.0.0.1:8111/v1"
# model = "PaddlePaddle/PaddleOCR-VL-1.6"

# [asr.endpoints.whisper]
# base_url = "http://127.0.0.1:9000/v1"
# model = "whisper-large-v3-turbo"

# [read]
# Files converted at once. Above 1, PDFs convert in worker processes
# jobs = 8
# Seconds of uncached OCR and speech per run. A rerun picks up the rest
# budget = 600
# Frames kept and OCR'd per video, spread over it
# frames = 20
# Largest URL download in bytes
# max_bytes = 20000000
# false keeps binary files no converter reads as unsupported instead of rendering them
# fallback = true
# Parquet rows melted per file, 0 for all
# parquet_rows = 200
# Longest side of the WebP saved per picture, 0 to save none
# picture_side = 1568
# picture_quality = 50

# [render]
# macOS only. false keeps Quick Look and Spotlight out of every render
# quicklook = true

[media]
# Interval frames per second on top of scene changes, 0 for none
fps = 0
scene = 0.3
sub_langs = ["ko", "en"]
