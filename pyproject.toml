[project]
name = "meltify"
version = "0.2.0"
description = "Melt files of any format into prompt-ready text where every line cites its source"
readme = "README.md"
requires-python = ">=3.11.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jeon-jihyeon" }]
keywords = ["llm", "prompt", "ocr", "pdf", "transcription", "claude-code", "agent-skills"]
dependencies = [
  "pymupdf>=1.26",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pillow>=11.3",
  "pi-heif>=1",
  "numpy>=2",
  "ocrmac>=1.0.1; sys_platform == 'darwin'",
  "trafilatura>=2",
  "python-hwpx>=1",
  "striprtf>=0.0.29",
]

[project.optional-dependencies]
office = ["markitdown[docx,pptx,outlook]>=0.1.8", "python-calamine>=0.4", "legacy-doc>=0.2"]
archive = ["libarchive-c>=5"]
iwork = ["numbers-parser>=4"]
render = ["playwright>=1.50"]
media = ["yt-dlp>=2026.8.19"]
asr-mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
ocr-paddle = ["paddleocr>=3.2", "paddlepaddle>=3.2"]
all = ["meltify[office,media,asr-mlx,archive]"]

[project.urls]
Repository = "https://github.com/jeon-jihyeon/meltify"

[project.scripts]
meltify = "meltify.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
markers = [
  "llm: calls a paid LLM API and runs only with MELTIFY_TEST_LLM=1",
  "heavy: needs a large model download",
  "macos: needs macOS frameworks",
]
