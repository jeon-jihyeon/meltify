[project]
name = "meltify"
version = "0.2.4"
description = "Melt files of any format into prompt-ready text where every block cites its source"
readme = "README.md"
requires-python = ">=3.11.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jeon-jihyeon" }]
keywords = ["llm", "prompt", "ocr", "pdf", "transcription", "claude-code", "agent-skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Text Processing :: General",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
]
dependencies = [
  "pymupdf>=1.26",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pillow>=11.3",
  "pi-heif>=1",
  "numpy>=2",
  "ocrmac>=1.0.1; sys_platform == 'darwin'",
  "trafilatura>=2",
  "python-hwpx>=1",
  "striprtf>=0.0.29",
]

[project.optional-dependencies]
office = [
  "markitdown[docx,pptx,outlook]>=0.1.8",
  "python-calamine>=0.4",
  "legacy-doc>=0.2",
  "olefile>=0.47",
  "metafile-render>=0.3",
]
# Password-protected Office, zip, HWP and iWork files
crypto = ["msoffcrypto-tool>=6", "pyzipper>=0.4", "cryptography>=42"]
archive = ["libarchive-c>=5"]
# Only Numbers needs it, since Pages and Keynote are read natively
iwork = ["numbers-parser>=4"]
parquet = ["pyarrow>=17"]
render = ["playwright>=1.50"]
media = ["yt-dlp>=2026.8.19"]
asr-mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
ocr-paddle = ["paddleocr>=3.7.0", "paddlepaddle>=3.2"]
all = ["meltify[office,media,asr-mlx,archive,parquet,crypto]"]

[project.urls]
Repository = "https://github.com/jeon-jihyeon/meltify"
Issues = "https://github.com/jeon-jihyeon/meltify/issues"
Changelog = "https://github.com/jeon-jihyeon/meltify/blob/main/CHANGELOG.md"
Releases = "https://github.com/jeon-jihyeon/meltify/releases"

[project.scripts]
meltify = "meltify.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
markers = [
  "llm: calls a paid LLM API, deselect with -m \"not llm\"",
  "heavy: needs a large model download",
  "macos: needs macOS frameworks",
]
