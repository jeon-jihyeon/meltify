lang = "ko"
out_dir = "meltify-out"

[llm]
claude_model = "claude-opus-5-5"
gemini_model = "gemini-3-pro"
openai_model = "gpt-5.5"
anthropic_key_env = "ANTHROPIC_API_KEY"
gemini_key_env = "GEMINI_API_KEY"
openai_key_env = "OPENAI_API_KEY"
openai_base_url = "https://api.openai.com/v1"

[ocr]
# auto picks every installed local engine.
# Paid LLM engines run only when you name them here or on the command line
engines = "auto"
upscale = 3
sharpen = true
tile_max = 2576
dpi = 300

[asr]
# auto tries mlx, then whispercpp, and never the paid API unless you name it
engine = "auto"
model = "mlx-community/whisper-large-v3-turbo"
whispercpp_model = ""
api_model = "whisper-1"

[media]
max_height = 1080
scene = 0.3
fps = 1.0
sub_langs = ["ko", "en"]
dedup_distance = 4

[submit]
url = ""
gap = 61.0
mode = "multipart"
field = "file"
auth_env = ""
score_path = "score"
goal = "max"
until_score = ""
max_attempts = 0
deadline = ""
idle_exit = 0.0
max_errors = 5

[check]
schema = ""
# count is unset by default, so 0 can require an empty answer list
unique = []
hygiene = true

[brief]
root = "problems"
template = "en"

[read]
jobs = 8
