# Language of the text OCR reads. Speech has its own asr.lang
lang = "ko"
out_dir = "meltify-out"

[llm]
claude_model = "claude-opus-5-5"
gemini_model = "gemini-3-pro"
openai_model = "gpt-5.5"
anthropic_key_env = "ANTHROPIC_API_KEY"
gemini_key_env = "GEMINI_API_KEY"
openai_key_env = "OPENAI_API_KEY"
openai_base_url = "https://api.openai.com/v1"

[ocr]
# auto picks every installed local engine and every endpoint below
# Paid LLM engines run only when you name them here or on the command line
engines = "auto"
# Resize factor for pictures before OCR, 0 to lift each small picture toward a readable size
upscale = 0.0
sharpen = true
tile_max = 2576
dpi = 300

# OCR models you serve yourself behind an OpenAI-compatible endpoint, one table each, like
# [ocr.endpoints.paddle-vl] with base_url and model, plus key_env, timeout or prompt if needed.
# Each is an engine named after its table that auto runs. It counts as an LLM in agreement,
# since it can guess. Only loopback and private addresses qualify, even when named, so a
# hosted API runs only as the claude, gemini or openai engine
[ocr.endpoints]

[asr]
# auto tries asr.endpoints, then whispercpp, and never the paid API unless you name it
engine = "auto"
whispercpp_model = ""
api_model = "whisper-1"
# Spoken language for every speech engine. auto lets Whisper detect it per file, since the
# top-level lang is the OCR text language and forcing it makes other speech come out translated
lang = "auto"

# Speech models you serve yourself, the same way as ocr.endpoints minus prompt
[asr.endpoints]

[media]
max_height = 1080
scene = 0.3
# Interval frames per second on top of scene changes, 0 for none
fps = 0.0
sub_langs = ["ko", "en"]
dedup_distance = 4

[read]
# Files converted at once. Above 1, PDFs convert in worker processes
jobs = 8
# Seconds of uncached OCR and speech per run. The rest stays listed as needs, and a rerun
# picks it up from where the cache left off
budget = 600
# Frames kept and OCR'd per video, scene changes and intervals together, spread over it
frames = 20
# Largest URL download in bytes
max_bytes = 20000000
# Binary files no converter reads get one more try: LibreOffice for the formats it imports,
# Pillow, ffprobe, then on macOS Quick Look and Spotlight. Off keeps them as an unsupported need
fallback = true
# Parquet rows melted per file, 0 for all. The rest stays counted as a need
parquet_rows = 200
# Each picture is also saved beside the markdown as a small WebP, so an agent can look at a
# chart or photo OCR text can't describe. Longest side in pixels, 0 to turn it off
picture_side = 1568
# WebP quality from 1 to 100. Exact text comes from OCR, so the picture only needs the layout
picture_quality = 50

[render]
# macOS only. Quick Look previews draw what LibreOffice can't or isn't installed for, like
# Keynote decks and EMF pictures. Off keeps those files as needs, and skips Spotlight too
quicklook = true
