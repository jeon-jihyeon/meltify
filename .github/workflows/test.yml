name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # uv.lock records a 7 day release-age cutoff, so CI resolves with the same one
  UV_EXCLUDE_NEWER: 7 days

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # Every uv sync and uv run in this job builds and uses a venv on this Python
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/sync_version.py --check
      - run: uv run pytest -m "not llm and not heavy"
      # Run again with the common extras so their converters are covered too
      - run: uv sync --locked --extra office --extra archive --extra parquet --extra crypto
      - run: uv run pytest -m "not llm and not heavy"
